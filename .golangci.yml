run:
  timeout: 5m
  build-tags:
    - integration

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - gocritic
    - revive
    - misspell
    - unconvert
    - unparam
    - bodyclose
    - noctx
    - sqlclosecheck
    - rowserrcheck
    - contextcheck
    - errorlint
    - goimports

linters-settings:
  goimports:
    local-prefixes: github.com/unisghimire/strato
  gosec:
    excludes:
      - G404 # math/rand is acceptable for jitter, never used for secrets
  revive:
    rules:
      - name: exported
        disabled: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - noctx
