version: v2
managed:
  enabled: true
  disable:
    # googleapis types resolve to google.golang.org/genproto — never rewrite
    # their go_package, or generated code imports a nonexistent local path.
    - file_option: go_package_prefix
      module: buf.build/googleapis/googleapis
  override:
    - file_option: go_package_prefix
      value: github.com/unisghimire/strato/proto/gen
plugins:
  - remote: buf.build/protocolbuffers/go
    out: proto/gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: proto/gen
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/gateway
    out: proto/gen
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/openapiv2
    out: docs/openapi
