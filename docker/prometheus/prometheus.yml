global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: strato-server
    static_configs:
      # host.docker.internal reaches a locally-run server from the container;
      # in compose "app" profile, the service DNS name works directly.
      - targets: ["host.docker.internal:9100", "server:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
