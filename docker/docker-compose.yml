name: strato

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: strato
      POSTGRES_PASSWORD: strato-dev-password
      POSTGRES_DB: strato
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strato -d strato"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: strato-minio
      MINIO_ROOT_PASSWORD: strato-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: ["/app/migrate"]
    command: ["--config", "/app/configs/config.yaml", "--source", "file:///app/migrations"]
    env_file: [../.env]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: [../.env]
    ports:
      - "8080:8080"  # REST + raw transfer
      - "9090:9090"  # gRPC
      - "9100:9100"  # Prometheus metrics
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: ["app"]

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: ["/app/worker"]
    command: ["--config", "/app/configs/config.yaml"]
    env_file: [../.env]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    profiles: ["app"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC

volumes:
  pgdata:
  redisdata:
  miniodata:
