apiVersion: apps/v1
kind: Deployment
metadata:
  name: strato-server
  namespace: strato
  labels:
    app.kubernetes.io/name: strato
    app.kubernetes.io/component: server
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: strato
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strato
        app.kubernetes.io/component: server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/unisghimire/strato:latest
          command: ["/app/migrate", "--config", "/app/configs/config.yaml", "--source", "file:///app/migrations"]
          envFrom:
            - configMapRef: { name: strato-config }
            - secretRef: { name: strato-secrets }
      containers:
        - name: server
          image: ghcr.io/unisghimire/strato:latest
          ports:
            - { name: http, containerPort: 8080 }
            - { name: grpc, containerPort: 9090 }
            - { name: metrics, containerPort: 9100 }
          envFrom:
            - configMapRef: { name: strato-config }
            - secretRef: { name: strato-secrets }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: strato-server
  namespace: strato
spec:
  selector:
    app.kubernetes.io/name: strato
    app.kubernetes.io/component: server
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: grpc, port: 9090, targetPort: grpc }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: strato-server
  namespace: strato
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: strato-server
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: strato-server
  namespace: strato
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: strato
      app.kubernetes.io/component: server
